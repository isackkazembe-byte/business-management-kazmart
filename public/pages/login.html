<script>
// ─── SOUND EFFECTS ──────────────────────────────────────────
(function() {
  var AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) {
    window.Sounds = { click: function(){}, success: function(){}, error: function(){}, hover: function(){} };
    return;
  }
  window.Sounds = {
    click: function() {
      try {
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.08);
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    },
    success: function() {
      try {
        var ctx = new AudioContext();
        [523, 659, 784].forEach(function(freq, i) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          var startTime = ctx.currentTime + (i * 0.1);
          gain.gain.setValueAtTime(0.12, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.12);
          osc.start(startTime);
          osc.stop(startTime + 0.12);
        });
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    },
    error: function() {
      try {
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 250;
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    },
    hover: function() {
      try {
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 1200;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.04);
        if (ctx.state === 'suspended') ctx.resume();
      } catch(e) {}
    }
  };
})();

function playClickSound() {
  try { window.Sounds && window.Sounds.click(); } catch(e) {}
}
function playHoverSound() {
  try { window.Sounds && window.Sounds.hover(); } catch(e) {}
}
function playSuccessSound() {
  try { window.Sounds && window.Sounds.success(); } catch(e) {}
}
function playErrorSound() {
  try { window.Sounds && window.Sounds.error(); } catch(e) {}
}

// ─── SHIFT MANAGEMENT ──────────────────────────────────────────

// Get current shift from localStorage
function getCurrentShift() {
  const raw = localStorage.getItem('kazmartShift');
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    if (data.active && data.userID === selectedUser?.userID) {
      return data;
    }
    return null;
  } catch {
    return null;
  }
}

// Start a new shift
function startShift(openingCash) {
  const shiftId = 'shift_' + Date.now();
  const shiftData = {
    id: shiftId,
    startTime: new Date().toISOString(),
    openingCash: openingCash || 0,
    active: true,
    userID: selectedUser.userID,
    username: selectedUser.username
  };
  localStorage.setItem('kazmartShift', JSON.stringify(shiftData));
  console.log('🕒 Shift started:', shiftData);
  return shiftData;
}

// ─── DOM ──────────────────────────────────────────────────────
const userGrid = document.getElementById('userGrid');
const userSelectionView = document.getElementById('userSelectionView');
const passwordView = document.getElementById('passwordView');
const selectedUserName = document.getElementById('selectedUserName');
const lPass = document.getElementById('lPass');
const lCash = document.getElementById('lCash');
const lBtn = document.getElementById('lBtn');
const loginErr = document.getElementById('loginErr');
const loginOk = document.getElementById('loginOk');
const backToUsersBtn = document.getElementById('backToUsersBtn');
const forgotPasswordLink = document.getElementById('forgotPasswordLink');
const lForgotMsg = document.getElementById('lForgotMsg');

let selectedUser = null;

// ─── Clock ──────────────────────────────────────────────────
function startClock() {
  function tick() {
    const now = new Date();
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const h = String(now.getHours()).padStart(2,"0");
    const m = String(now.getMinutes()).padStart(2,"0");
    const s = String(now.getSeconds()).padStart(2,"0");
    document.getElementById('loginClock').textContent = h+":"+m+":"+s;
    document.getElementById('loginDate').textContent = days[now.getDay()]+" "+
      now.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  }
  tick();
  setInterval(tick, 1000);
}
startClock();

// ─── Load Users ──────────────────────────────────────────────
async function loadUsers() {
  try {
    const snapshot = await db.collection('users').get();
    console.log('📦 Users:', snapshot.size);
    if (snapshot.empty) {
      userGrid.innerHTML = `<div style="text-align:center;padding:20px;color:#AABCC4;grid-column:1/-1;font-size:13px;">No users found.</div>`;
      return;
    }
    const users = [];
    snapshot.forEach(doc => {
      const data = doc.data();
      users.push({
        userID: doc.id,
        fullName: data.fullName || data.name || 'Unknown',
        username: data.username || '',
        role: data.role || 'Operator',
        status: (data.status || '').toLowerCase(),
        email: data.email || ''
      });
    });
    const active = users.filter(u => u.status === 'active');
    const list = active.length ? active : users;
    userGrid.innerHTML = list.map((user, index) => {
      const initials = user.fullName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
      const colors = ['#E8F5E9','#E3F2FD','#FFF3E0','#FCE4EC','#F3E5F5','#E0F7FA'];
      const bg = colors[index % colors.length];
      return `
        <div class="user-card" 
             data-username="${user.username}" 
             data-fullname="${user.fullName}" 
             data-role="${user.role}"
             data-email="${user.email}"
             data-userid="${user.userID}"
             onclick="selectUserWithSound(this)"
             onmouseenter="playHoverSound()"
             style="animation: fadeInUp 0.3s ease ${index * 0.05}s both;">
          <div class="user-status ${user.status === 'active' ? 'active' : 'inactive'}"></div>
          <div class="user-avatar" style="border-color:var(--teal-light);color:var(--teal);background:${bg};">${initials}</div>
          <div class="user-name">${user.fullName}</div>
          <div class="user-role">${user.role === 'cashier' ? 'Operator' : user.role === 'Admin' ? 'Admin' : user.role}</div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    userGrid.innerHTML = `<div style="text-align:center;padding:20px;color:var(--red);grid-column:1/-1;">Error: ${err.message}</div>`;
  }
}

function selectUserWithSound(el) {
  playClickSound();
  selectUser(el);
}

function selectUser(el) {
  selectedUser = {
    username: el.dataset.username,
    fullName: el.dataset.fullname,
    role: el.dataset.role,
    email: el.dataset.email,
    userID: el.dataset.userid
  };
  userSelectionView.style.display = 'none';
  passwordView.style.display = 'block';
  selectedUserName.textContent = selectedUser.fullName;
  lPass.value = '';
  lPass.focus();

  const cashField = document.getElementById('lCashField');
  const isOperator = (selectedUser.role === 'Operator' || selectedUser.role === 'cashier');

  if (isOperator) {
    const shift = getCurrentShift();
    if (shift && shift.active) {
      cashField.style.display = 'none';
    } else {
      cashField.style.display = 'block';
    }
  } else {
    cashField.style.display = 'none';
  }

  loginErr.style.display = 'none';
  loginOk.style.display = 'none';
  lForgotMsg.style.display = 'none';
}

backToUsersBtn.addEventListener('click', function() {
  userSelectionView.style.display = 'block';
  passwordView.style.display = 'none';
  loginErr.style.display = 'none';
  loginOk.style.display = 'none';
  lPass.value = '';
  selectedUser = null;
});

// ─── FORGOT PASSWORD ──────────────────────────────────────────
forgotPasswordLink.addEventListener('click', async function(e) {
  e.preventDefault();
  if (!selectedUser) {
    loginErr.textContent = 'Please select a user first.';
    loginErr.style.display = 'block';
    return;
  }
  const username = selectedUser.username;
  try {
    const userQuery = await db.collection('users').where('username', '==', username).limit(1).get();
    if (userQuery.empty) {
      alert('User not found.');
      return;
    }
    const email = userQuery.docs[0].data().email;
    if (!email) {
      alert('No email associated with this account. Contact admin.');
      return;
    }
    await auth.sendPasswordResetEmail(email);
    lForgotMsg.textContent = '✅ Password reset email sent to ' + email + '. Check your inbox.';
    lForgotMsg.style.display = 'block';
    lForgotMsg.style.background = 'var(--green-light)';
    lForgotMsg.style.color = 'var(--green)';
  } catch (error) {
    lForgotMsg.textContent = '❌ Error: ' + error.message;
    lForgotMsg.style.display = 'block';
    lForgotMsg.style.background = 'var(--red-light)';
    lForgotMsg.style.color = 'var(--red)';
  }
});

// ─── DO LOGIN ──────────────────────────────────────────────────
async function doLogin() {
  if (!selectedUser) {
    loginErr.textContent = 'Please select a user first.';
    loginErr.style.display = 'block';
    return;
  }

  const password = lPass.value.trim();
  const username = selectedUser.username;

  if (!password) {
    loginErr.textContent = 'Please enter your password.';
    loginErr.style.display = 'block';
    return;
  }

  // ─── Operator opening cash check ──────────────────────────
  const isOperator = (selectedUser.role === 'Operator' || selectedUser.role === 'cashier');
  const shift = getCurrentShift();
  const requiresCash = isOperator && !shift;
  const cash = parseFloat(lCash.value) || 0;

  if (requiresCash) {
    if (isNaN(cash) || cash <= 0) {
      loginErr.textContent = '⚠️ Please enter a valid opening cash amount (must be greater than 0).';
      loginErr.style.display = 'block';
      lCash.focus();
      return;
    }
  }

  lBtn.disabled = true;
  lBtn.innerHTML = '<span class="spin"></span> Signing in...';
  loginErr.style.display = 'none';
  loginOk.style.display = 'none';

  try {
    // 1. Look up user in Firestore to get email
    const userQuery = await db.collection('users').where('username', '==', username).limit(1).get();
    if (userQuery.empty) {
      throw new Error('User not found.');
    }
    const userDoc = userQuery.docs[0];
    const userData = userDoc.data();
    const email = userData.email;

    if (!email) {
      throw new Error('No email associated with this account.');
    }

    // 2. Sign in with Firebase Auth
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    
    // 3. Login successful
    playSuccessSound();
    const welcomeName = userData.username || userData.fullName || userData.name || userData.email || 'User';
loginOk.textContent = 'Welcome, ' + welcomeName + '!';
    loginOk.style.display = 'block';

    // 4. Store user profile in sessionStorage
    const userInfo = {
      userID: userDoc.id,
      name: userData.fullName,
      role: userData.role,
      username: userData.username,
      email: userData.email,
      uid: userCredential.user.uid
    };
    sessionStorage.setItem('kazmartUser', JSON.stringify(userInfo));

    // 5. Start shift if operator
    if (requiresCash && cash > 0) {
      startShift(cash);
      localStorage.setItem('kazmartOpeningCash', String(cash));
    }

    // 6. Redirect to app
    setTimeout(() => { window.location.href = '../index.html'; }, 800);

  } catch (error) {
    playErrorSound();
    loginErr.textContent = error.message || 'Login failed.';
    loginErr.style.display = 'block';
    lPass.value = '';
    lPass.focus();
  } finally {
    lBtn.disabled = false;
    lBtn.innerHTML = 'Sign In';
  }
}

// ─── EVENT LISTENERS ──────────────────────────────────────────
lPass.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
lCash.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
lBtn.addEventListener('click', doLogin);

// ─── LOAD USERS ──────────────────────────────────────────────
loadUsers();
console.log('✅ Premium login page ready with Firebase Auth.');
</script>
</body>
